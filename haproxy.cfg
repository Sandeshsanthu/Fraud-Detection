global
    maxconn 4096

defaults
    mode tcp                      # same as the NLB: Layer 4, no request inspection
    timeout connect 1s
    timeout client  10s
    timeout server  10s

resolvers docker
    nameserver dns 127.0.0.11:53  # Docker's DNS lists every [5] container
    hold valid 2s

frontend fraud_front_door
    bind *:8080
    default_backend decision_service

backend decision_service
    balance roundrobin
    option httpchk GET /healthz   # only healthy containers get traffic
    default-server check inter 2s fall 2 rise 2 port 9000
    server-template app 1-5 decision-service:9000 resolvers docker init-addr none


# this will replace by loadbalancer in aws
