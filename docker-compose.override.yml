# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: docker-compose.override.yml
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    expose: ["8000"]

  decision-service:
    depends_on:
      - dynamodb-local
      - localstack
    environment:
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
      AWS_ENDPOINT_URL_KINESIS: http://localstack:4566
      KINESIS_STREAM: payment-events

  localstack:
    image: localstack/localstack:3.8
    ports: ["4566:4566"]
    environment:
      SERVICES: kinesis
    volumes:
      - ./init-kinesis.sh:/etc/localstack/init/ready.d/init-kinesis.sh
